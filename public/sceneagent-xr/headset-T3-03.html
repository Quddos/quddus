<!doctype html>
<html><head><meta charset="utf-8"><title>SceneAgent-XR headset test T3-03</title>
<script src="vendor/aframe.min.js"></script>
<script>
AFRAME.registerComponent('fps-meter', {
  init: function () { this.t = performance.now(); this.n = 0; this.hist = [];
    this.loadMs = Math.round(performance.now()); },
  tick: function () {
    this.n++; var now = performance.now();
    if (now - this.t >= 1000) {
      var fps = this.n * 1000 / (now - this.t); this.hist.push(fps); if (this.hist.length > 10) this.hist.shift();
      var avg = this.hist.reduce(function (a, b) { return a + b; }, 0) / this.hist.length;
      var mode = this.el.sceneEl.is('vr-mode') ? 'VR' : 'desktop';
      this.el.setAttribute('value', mode + ' | FPS ' + fps.toFixed(0) + ' | 10 s avg ' + avg.toFixed(0) +
                           ' | loaded in ' + this.loadMs + ' ms');
      this.n = 0; this.t = now; }
  }
});
</script>
